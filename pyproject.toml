[project]
name = "tmem-repro"
version = "0.1.0"
description = "Re-implementation of TMEM fast-weight parametric memory (arXiv:2606.04536), inference-time part"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "transformers>=4.51",
  "accelerate>=0.33",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
